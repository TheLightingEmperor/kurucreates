<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neko-bin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <script type="module" crossorigin src="./assets/index-DU_dWK75.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CYtUvmSc.css">
</head>
<body>
<div id="app"></div>

<!-- Title screen -->
<section id="title" class="screen">
  <div class="title-card">
    <p class="kana">ねこ便</p>
    <h1>Neko-bin</h1>
    <p class="tag">Lost kittens. A tiny town. One courier.</p>
    <button id="begin" type="button">Begin</button>
    <p class="loading" id="loading">Building the town…</p>
  </div>
</section>

<!-- HUD -->
<div id="hud" hidden>
  <div class="hud-top">
    <div class="stamps" id="stamps" aria-label="Kittens delivered"></div>
    <div class="carry" id="carry" aria-label="Kittens following you"></div>
  </div>
  <div class="prompt" id="prompt" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <div class="keys" id="keys">
    <span><kbd>WASD</kbd> move</span>
    <span><kbd>Shift</kbd> run</span>
    <span><kbd>Space</kbd> jump</span>
    <span><kbd>E</kbd> pick up / deliver</span>
    <span><kbd>Q</kbd> call kittens</span>
    <span><kbd>J</kbd> posters</span>
    <span>drag to look</span>
  </div>
  <div class="call-meter" id="callMeter"><span></span></div>
</div>

<!-- Off-screen marker for the current delivery target -->
<div id="marker" hidden><span class="pin"></span></div>

<!-- Missing posters journal -->
<section id="journal" class="screen" hidden>
  <div class="journal-card">
    <header>
      <h2>Missing kittens</h2>
      <button id="closeJournal" type="button" aria-label="Close posters">Close</button>
    </header>
    <div class="posters" id="posters"></div>
  </div>
</section>

<!-- End screen -->
<section id="end" class="screen" hidden>
  <div class="title-card">
    <p class="kana">おつかれさま</p>
    <h1>All home</h1>
    <p class="tag" id="endText"></p>
    <button id="again" type="button">Play again</button>
  </div>
</section>

</body>
</html>
