<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thanks — Karan Kothari</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080808; color: #F0EDE6; font-family: 'Archivo', system-ui, sans-serif; padding: 24px max(20px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
  main { max-width: 560px; display: flex; flex-direction: column; gap: 20px; }
  span { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #C8FF47; }
  h1 { font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; font-size: clamp(52px, 10vw, 88px); line-height: .92; margin: 0; }
  p { color: rgba(240,237,230,.72); font-size: 17px; line-height: 1.6; margin: 0; }
  a { color: #080808; background: #C8FF47; text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; padding: 14px 20px; align-self: flex-start; }
</style>
</head>
<body>
<main>
  <span>Message received</span>
  <h1>Thanks for writing.</h1>
  <p>Your message is in. I'll get back to you soon.</p>
  <a href="/">Back to the site</a>
</main>
</body>
</html>
