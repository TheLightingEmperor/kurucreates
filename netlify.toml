[build]
  publish = "."

# games, 3D viewers and their media moved from /ai/ to /design/ on 2026-10-29
[[redirects]]
  from = "/ai/play/*"
  to = "/design/play/:splat"
  status = 301

[[redirects]]
  from = "/ai/viewer/*"
  to = "/design/viewer/:splat"
  status = 301

[[redirects]]
  from = "/ai/media/*"
  to = "/design/media/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
